<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Günün Kelimesi</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #120102; color: #e2b660; font-family: Montserrat, sans-serif; }
  body.render { overflow: hidden; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { display: block; background: #000; }
  body:not(.render) canvas { height: min(84vh, 1920px); width: auto; aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); }
  body.render #stage { padding: 0; }
  body.render #ui { display: none; }
  #ui { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  #ui button { background: #2a0306; color: #e2b660; border: 1px solid #6a4a1e; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #ui input { flex: 1; accent-color: #e2b660; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">▶︎ Oynat</button>
    <input id="scrub" type="range" min="0" max="19" step="0.0333" value="0">
    <span id="time">0.00 s</span>
  </div>
</div>
<script src="timeline.js"></script>
<script>
  // ?word=ab  ->  words/ab.js
  document.write('<script src="words/' + (new URLSearchParams(location.search).get('word') || 'ab').replace(/[^a-z0-9_-]/gi, '') + '.js"><\/script>');
</script>
<script src="anim.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const sample = 'abcçğıiİöşüâāÖÜÇŞĞ “”· ' + (window.WORD.origin.native || '');
  await Promise.all(['400', '500', '600', '700', '800', 'italic 400', 'italic 500', 'italic 700']
    .map(w => document.fonts.load(w.replace(/^(\d)/, 'normal $1') + ' 40px Montserrat', sample)));
  await document.fonts.load('600 40px "Noto Naskh Arabic"', window.WORD.origin.native || 'آب');
  await document.fonts.ready;
  init(canvas);
  window.renderAt = t => { renderFrame(t); return true; };
  window.animReady = true;
  if (params.has('render')) { document.body.classList.add('render'); return; }
  const T = TIMELINE.duration;
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
  scrub.max = T;
  let playing = false, t0 = 0, start = 0;
  const show = t => { renderFrame(t); scrub.value = t; timeEl.textContent = t.toFixed(2) + ' s'; };
  function loop(now) {
    if (!playing) return;
    show((t0 + (now - start) / 1000) % T);
    requestAnimationFrame(loop);
  }
  btn.onclick = () => {
    playing = !playing;
    btn.textContent = playing ? '❚❚ Durdur' : '▶︎ Oynat';
    if (playing) { t0 = parseFloat(scrub.value); start = performance.now(); requestAnimationFrame(loop); }
  };
  scrub.oninput = () => { playing = false; btn.textContent = '▶︎ Oynat'; show(parseFloat(scrub.value)); };
  show(parseFloat(params.get('t') || '0'));
})();
</script>
</body>
</html>
