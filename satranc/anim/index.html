<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satranç Dersi 01 — Satranç Tahtası</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; color: #FFC94A; font-family: Montserrat, sans-serif; }
  body.render { overflow: hidden; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { display: block; background: #000; }
  body:not(.render) canvas { height: min(84vh, 1920px); width: auto; aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); }
  body.render #stage { padding: 0; }
  body.render #ui { display: none; }
  #ui { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  #ui button { background: #111; color: #FFC94A; border: 1px solid #5a4a2a; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #ui input { flex: 1; accent-color: #FFC94A; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">▶︎ Oynat</button>
    <input id="scrub" type="range" min="0" max="75" step="0.0333" value="0">
    <span id="time">0.00 s</span>
  </div>
  <audio id="audio" src="../output/sfx.wav" preload="auto" loop></audio>
</div>
<script src="timeline.js"></script>
<script src="scene.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  await Promise.all(['600 40px Montserrat', '700 40px Montserrat', '800 40px Montserrat', '900 40px Montserrat', '300 40px Montserrat']
    .map(f => document.fonts.load(f, 'SATRANÇ TAHTASI ğüşıöçİ')));
  await document.fonts.ready;
  init(canvas);
  window.renderAt = t => { renderFrame(t); return true; };
  window.animReady = true;
  if (params.has('render')) { document.body.classList.add('render'); return; }
  if (params.has('t')) { renderFrame(parseFloat(params.get('t'))); return; }

  const audio = document.getElementById('audio');
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
  scrub.max = TL.duration;
  let playing = false, t0 = 0, start = 0;
  const show = t => { renderFrame(t); scrub.value = t; timeEl.textContent = t.toFixed(2) + ' s'; };
  const tick = () => {
    if (!playing) return;
    const t = (start + (performance.now() - t0) / 1000) % TL.duration;
    show(t); requestAnimationFrame(tick);
  };
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? '❚❚ Duraklat' : '▶︎ Oynat';
    if (playing) { start = parseFloat(scrub.value); t0 = performance.now(); audio.currentTime = start; audio.play().catch(() => {}); tick(); }
    else audio.pause();
  };
  scrub.oninput = () => { if (playing) btn.onclick(); show(parseFloat(scrub.value)); };
  show(0);
})();
</script>
</body>
</html>
