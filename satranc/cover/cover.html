<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Satranç Tahtası — Kapak</title>
<link rel="stylesheet" href="../anim/fonts/fonts.css">
<style>html, body { margin: 0; background: #4E3220; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 9:16 cover in a flat, outlined illustration style: title block over a free-standing
// isometric chessboard with a king and a queen, in the video's colours on the logo's brown.
(async function () {
  await Promise.all(['500 40px Montserrat', '700 40px Montserrat', '800 40px Montserrat', '900 40px Montserrat']
    .map(f => document.fonts.load(f, 'SATRANÇ TAHTASI İ')));
  const W = 1080, H = 1920;
  // palette taken from the video (anim/scene.js)
  // background = the logo's brown (#4E3220); text, ring, board and pieces keep the video's colours
  const C = { bg: '#4E3220', white: '#F7F3EA', gold: '#FFC94A', ink: '#24160c',
    light: '#F0D9B5', dark: '#B58863', frame: '#2b1e15', side: '#5a3d26', sideDark: '#3d2918' };
  const ctx = document.getElementById('c').getContext('2d');
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  // flat logo-brown background with the video's faint tilted checker and warm glow
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.21); ctx.fillStyle = 'rgba(255,255,255,0.022)';
  for (let i = -10; i < 10; i++) for (let j = -12; j < 12; j++) if (!((i + j) & 1)) ctx.fillRect(i * 150 - 300, j * 150 - 300, 150, 150);
  ctx.restore();
  const rg = ctx.createRadialGradient(W / 2, 1100, 60, W / 2, 1100, 900);
  rg.addColorStop(0, 'rgba(255,201,74,0.12)'); rg.addColorStop(1, 'rgba(255,201,74,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  const text = (s, x, y, size, weight, color, spacing = 0) => {
    ctx.font = `${weight} ${size}px Montserrat`; ctx.letterSpacing = spacing + 'px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
    ctx.fillText(s, x + spacing / 2, y);
  };
  const fit = (s, weight, size, maxW, spacing = 0) => {
    ctx.font = `${weight} ${size}px Montserrat`; ctx.letterSpacing = spacing + 'px';
    const w = ctx.measureText(s).width; return w > maxW ? size * maxW / w : size;
  };

  // title block
  text('SATRANÇ', W / 2, 450, fit('SATRANÇ', 900, 108, 760, 2), 900, C.white, 2);
  text('TAHTASI', W / 2, 598, fit('TAHTASI', 900, 146, 820, 2), 900, C.gold, 2);

  // free-standing board: soft ground shadow, warm glow and a few gold sparkles around it
  const MX = W / 2, MY = 1120;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(MX, 1500, 380, 34, 0, 0, Math.PI * 2); ctx.fill();
  const dg = ctx.createRadialGradient(MX, MY - 20, 20, MX, MY - 20, 460);
  dg.addColorStop(0, 'rgba(255,201,74,0.22)'); dg.addColorStop(1, 'rgba(255,201,74,0)');
  ctx.fillStyle = dg; ctx.fillRect(0, MY - 480, W, 960);
  ctx.strokeStyle = 'rgba(255,201,74,0.55)'; ctx.lineCap = 'round'; ctx.lineWidth = 2.5;
  for (let i = 0; i < 22; i++) {
    const x = 170 + rnd() * 740, y = 760 + rnd() * 300, s = 4 + rnd() * 7;
    ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
  }

  // isometric board: top face at (BXc, BYc); thickness drawn as two side faces
  const BXc = MX, BYc = MY + 70, S = 52, N = 8, SQ = 0.56;
  const iso = (u, v) => [BXc + (u - v) * S * Math.SQRT1_2, BYc + (u + v) * S * Math.SQRT1_2 * SQ];
  const half = N / 2 + 0.35, TH = 34;
  const P = [iso(-half, -half), iso(half, -half), iso(half, half), iso(-half, half)];
  const poly = (pts, fill) => {
    ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
  };
  poly([P[3], P[2], [P[2][0], P[2][1] + TH], [P[3][0], P[3][1] + TH]], C.side);
  poly([P[2], P[1], [P[1][0], P[1][1] + TH], [P[2][0], P[2][1] + TH]], C.sideDark);
  poly(P, C.frame);
  for (let f = 0; f < N; f++) for (let r = 0; r < N; r++) {
    const u = f - N / 2, v = (N - 1 - r) - N / 2;   // white's view: a1 in the near-left corner
    ctx.beginPath();
    [[u, v], [u + 1, v], [u + 1, v + 1], [u, v + 1]].map(([a, b]) => iso(a, b)).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath(); ctx.fillStyle = (f + r) % 2 ? C.light : C.dark; ctx.fill();
  }
  ctx.beginPath(); [iso(-4, -4), iso(4, -4), iso(4, 4), iso(-4, 4)].forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath(); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.stroke();

  // pieces (100-unit boxes, origin at the base centre)
  let lw = 5.5;
  const style = (fill) => { ctx.fillStyle = fill; ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.lineJoin = 'round'; };
  const base = (fill) => {
    ctx.beginPath(); ctx.ellipse(0, 0, 36, 11, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(20,14,10,0.35)'; ctx.fill();
    style(fill);
    ctx.beginPath(); ctx.roundRect(-34, -16, 68, 16, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-26, -26, 52, 11, 4); ctx.fill(); ctx.stroke();
  };
  function king(x, y, s, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); lw = 5 / s;
    base(fill); style(fill);
    ctx.beginPath();
    ctx.moveTo(-24, -26); ctx.bezierCurveTo(-26, -44, -38, -50, -36, -62); ctx.bezierCurveTo(-34, -78, -10, -78, 0, -62);
    ctx.bezierCurveTo(10, -78, 34, -78, 36, -62); ctx.bezierCurveTo(38, -50, 26, -44, 24, -26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22, -40); ctx.quadraticCurveTo(0, -48, 22, -40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, -64); ctx.lineTo(-5, -78); ctx.lineTo(-12, -78); ctx.lineTo(-12, -86); ctx.lineTo(-5, -86); ctx.lineTo(-5, -94);
    ctx.lineTo(5, -94); ctx.lineTo(5, -86); ctx.lineTo(12, -86); ctx.lineTo(12, -78); ctx.lineTo(5, -78); ctx.lineTo(5, -64); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function queen(x, y, s, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); lw = 5 / s;
    base(fill); style(fill);
    const tops = [[-38, -72], [-19, -82], [0, -88], [19, -82], [38, -72]];
    ctx.beginPath(); ctx.moveTo(-26, -26); ctx.lineTo(...tops[0]); ctx.lineTo(-24, -50); ctx.lineTo(...tops[1]); ctx.lineTo(-8, -54);
    ctx.lineTo(...tops[2]); ctx.lineTo(8, -54); ctx.lineTo(...tops[3]); ctx.lineTo(24, -50); ctx.lineTo(...tops[4]); ctx.lineTo(26, -26);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    for (const [px, py] of tops) { ctx.beginPath(); ctx.arc(px, py - 4, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-23, -38); ctx.quadraticCurveTo(0, -44, 23, -38); ctx.stroke();
    ctx.restore();
  }
  // queen on d-file, king on e-file, both on the back half so the squares stay visible
  const [qx, qy] = iso(-2.4, 0.4), [kx, ky] = iso(0.4, -2.4);
  queen(qx, qy, 1.95, '#fbf7ef');
  king(kx, ky, 2.05, '#fbf7ef');

  window.coverReady = true;
})();
</script>
</body>
</html>
