<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>William Golding</title>
<link rel="stylesheet" href="../animation/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #111; color: #eee; font-family: Montserrat, sans-serif; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { display: block; }
  body:not(.render) canvas { height: min(84vh, 1920px); width: auto; aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); }
  body.render #stage { padding: 0; }
  body.render #ui { display: none; }
  #ui { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  #ui button { background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #ui input { flex: 1; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">▶︎</button>
    <input id="scrub" type="range" min="0" max="170" step="0.0333" value="0">
    <span id="time">0.00 s</span>
  </div>
  <audio id="audio" src="../output/william_golding_music.wav" preload="auto"></audio>
</div>
<script src="core.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const fams = ['500 40px Montserrat', '600 40px Montserrat', '700 40px Montserrat', '800 40px Montserrat',
    'italic 500 40px "Cormorant Garamond"', '600 40px "Cormorant Garamond"', '600 40px Caveat'];
  await Promise.all(fams.map(f => document.fonts.load(f, 'Golding İçimizdeki ğüşıöçâ “”’')));
  await document.fonts.ready;
  init(canvas);
  window.DURATION = DURATION;
  window.renderAt = t => { renderFrame(t); return true; };
  window.animReady = true;
  if (params.has('render')) { document.body.classList.add('render'); return; }
  if (params.has('t')) { renderFrame(parseFloat(params.get('t'))); return; }
  const audio = document.getElementById('audio');
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
  scrub.max = DURATION;
  let playing = false, t0 = 0, start = 0;
  const show = t => { renderFrame(t); scrub.value = t; timeEl.textContent = t.toFixed(2) + ' s'; };
  const loop = () => { if (!playing) return; const t = start + (performance.now() - t0) / 1000; if (t >= DURATION) { playing = false; btn.textContent = '▶︎'; return; } show(t); requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶︎'; if (playing) { start = parseFloat(scrub.value); t0 = performance.now(); audio.currentTime = start; audio.play().catch(() => {}); loop(); } else audio.pause(); };
  scrub.oninput = () => { show(parseFloat(scrub.value)); if (playing) { start = parseFloat(scrub.value); t0 = performance.now(); audio.currentTime = start; } };
  show(0);
})();
</script>
</body>
</html>
