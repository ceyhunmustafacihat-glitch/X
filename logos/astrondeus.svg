<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD39B"/>
      <stop offset="1" stop-color="#C7A56C"/>
    </linearGradient>
    <clipPath id="front"><rect x="-600" y="0" width="1200" height="600"/></clipPath>
  </defs>
  <rect width="1080" height="1080" fill="#3A2470"/>
  <g transform="translate(540 540) rotate(-18)">
    <mask id="gap" maskUnits="userSpaceOnUse" x="-600" y="-600" width="1200" height="1200">
      <rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/>
      <ellipse rx="300" ry="78" fill="none" stroke="#000" stroke-width="64" clip-path="url(#front)"/>
    </mask>
    <g id="rings" fill="none" stroke="url(#gold)">
      <ellipse rx="318" ry="86" stroke-width="16"/>
      <ellipse rx="282" ry="70" stroke-width="7"/>
    </g>
    <g mask="url(#gap)"><circle r="150" fill="url(#gold)" transform="rotate(18)"/></g>
    <use href="#rings" clip-path="url(#front)"/>
  </g>
</svg>
