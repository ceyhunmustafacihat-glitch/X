<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1080" height="1080">
  <!-- sözlükdeus profil görseli: asasının ucunda açık kitap taşıyan bilge -->
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="0.45" stop-color="#121212"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="glow" cx="700" cy="215" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="robeLit" x1="1" y1="0" x2="0" y2="0.6">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="hat" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.55" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="brim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.6" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="hair" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c8c8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="face" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b9b9"/>
      <stop offset="1" stop-color="#5e5e5e"/>
    </linearGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.6" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frame"><circle cx="500" cy="500" r="472"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- light from the staff -->
    <circle cx="700" cy="215" r="300" fill="url(#glow)"/>
    <g fill="#ffffff">
      <circle cx="180" cy="230" r="1.6" opacity="0.5"/><circle cx="260" cy="150" r="1.2" opacity="0.4"/>
      <circle cx="150" cy="380" r="1.1" opacity="0.35"/><circle cx="560" cy="110" r="1.4" opacity="0.5"/>
      <circle cx="860" cy="390" r="1.3" opacity="0.4"/><circle cx="820" cy="110" r="1.8" opacity="0.55"/>
      <circle cx="600" cy="330" r="1.2" opacity="0.45"/><circle cx="880" cy="250" r="1" opacity="0.4"/>
      <circle cx="230" cy="300" r="0.9" opacity="0.3"/><circle cx="780" cy="330" r="1.4" opacity="0.5"/>
    </g>

    <!-- robe / cloak -->
    <path d="M90 1000 C120 840 180 700 280 640 C330 610 368 588 392 540 L478 540 C502 588 540 610 584 626 C644 660 704 740 760 830 C792 884 812 944 830 1000 Z" fill="url(#robe)"/>
    <path d="M280 645 C230 720 200 820 190 1000" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M280 640 C330 610 368 588 392 540" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <!-- cloak edge falling from the shoulders -->
    <path d="M330 640 C300 760 300 880 320 1000" fill="none" stroke="#5a5a5a" stroke-width="2"/>
    <path d="M560 640 C600 760 610 880 600 1000" fill="none" stroke="#5a5a5a" stroke-width="2"/>
    <path d="M335 645 C360 760 380 880 400 1000 L520 1000 C535 880 548 760 555 645 Z" fill="#000" fill-opacity="0.35"/>

    <!-- long hair behind the shoulders -->
    <path d="M350 412 C336 470 318 530 300 590 C288 630 296 668 330 684 C322 660 330 640 344 620 C340 646 352 668 372 676 C378 620 390 560 404 500 L404 412 Z" fill="url(#hair)"/>
    <path d="M512 412 C528 470 548 530 564 584 C576 624 568 656 540 670 C546 648 540 630 528 614 C530 640 520 660 502 668 C494 612 480 556 466 500 L466 412 Z" fill="url(#hair)"/>
    <g fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-linecap="round">
      <path d="M346 450 C330 520 312 580 306 650"/><path d="M366 470 C352 540 340 600 336 660"/><path d="M384 480 C372 560 364 620 362 668"/>
      <path d="M520 450 C538 510 552 560 556 630"/><path d="M500 470 C514 530 526 590 528 650"/><path d="M484 480 C496 560 504 620 506 660"/>
    </g>

    <!-- raised sleeve -->
    <path d="M500 625 C560 610 630 585 676 552 L734 600 C716 650 690 700 676 770 C640 760 590 720 560 690 C540 672 520 650 500 625 Z" fill="url(#robeLit)"/>
    <path d="M676 552 L734 600" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M520 640 C580 640 640 610 690 572" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <path d="M560 690 C610 690 660 660 706 612" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M676 770 C690 700 716 650 734 600" fill="none" stroke="#8a8a8a" stroke-width="2"/>

    <!-- staff -->
    <path d="M712 1000 C716 900 706 820 710 740 C714 640 702 520 706 420 C708 360 700 320 702 292" fill="none" stroke="url(#wood)" stroke-width="22" stroke-linecap="round"/>
    <path d="M716 1000 C720 900 710 820 714 740 C718 640 706 520 710 420 C712 360 704 320 706 300" fill="none" stroke="#bdbdbd" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <g fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round">
      <path d="M700 470 C705 476 712 476 716 470"/><path d="M702 800 C708 806 716 806 720 800"/>
      <path d="M699 380 C704 386 711 386 715 380"/>
    </g>
    <!-- crook: gnarled wood cradling the book -->
    <circle cx="704" cy="208" r="84" fill="#fff" opacity="0.35" filter="url(#soft)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M704 300 C664 292 630 262 626 220 C622 172 650 136 690 124 C702 120 708 110 700 100 C692 92 680 98 684 108" stroke="#6a6a6a" stroke-width="13"/>
      <path d="M704 300 C746 294 780 262 784 218 C788 176 766 142 730 128 C720 124 716 112 726 106 C734 102 740 110 734 116" stroke="#5a5a5a" stroke-width="11"/>
      <path d="M700 296 C662 286 634 258 631 220 C628 176 654 142 692 130" stroke="#e0e0e0" stroke-width="2.2"/>
      <path d="M710 296 C748 288 776 258 778 218 C780 182 762 152 732 138" stroke="#a8a8a8" stroke-width="2"/>
      <path d="M632 254 C614 262 606 280 612 296" stroke="#5a5a5a" stroke-width="7"/>
      <path d="M778 176 C796 166 806 148 800 132" stroke="#4e4e4e" stroke-width="6"/>
      <path d="M698 330 C690 320 688 308 696 300 M712 336 C720 324 720 310 712 302" stroke="#2e2e2e" stroke-width="8"/>
    </g>
    <!-- the emblem: sözlükdeus open book -->
    <circle cx="704" cy="208" r="70" fill="url(#orb)" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="704" cy="208" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <g transform="translate(704 210)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -20 C-10 -30 -26 -33 -40 -28 L-40 24 C-26 19 -10 21 0 30 Z"/>
      <path d="M0 -20 C10 -30 26 -33 40 -28 L40 24 C26 19 10 21 0 30 Z"/>
    </g>

    <!-- hand gripping the staff -->
    <path d="M684 548 C690 532 724 528 734 540 C740 556 738 584 728 600 C716 610 694 606 686 594 C680 580 680 562 684 548 Z" fill="#9a9a9a"/>
    <g fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round">
      <path d="M690 556 C702 552 718 552 732 556"/><path d="M688 570 C702 566 718 566 734 570"/><path d="M688 584 C702 580 718 580 732 584"/>
    </g>
    <path d="M686 552 C680 560 682 574 694 578" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>

    <!-- face -->
    <path d="M382 410 C378 450 384 500 404 520 C420 534 444 534 462 520 C482 500 488 450 484 410 Z" fill="url(#face)"/>
    <path d="M382 410 L484 410 L484 470 L382 470 Z" fill="url(#faceShade)"/>
    <!-- brows, eyes, nose -->
    <path d="M394 448 C408 438 424 440 432 448 C420 446 406 448 394 454 Z" fill="#e8e8e8"/>
    <path d="M472 448 C460 438 444 440 438 448 C450 446 462 448 474 454 Z" fill="#e8e8e8"/>
    <path d="M404 458 C410 454 420 454 426 458" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M444 458 C450 454 460 454 466 458" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M435 452 C438 470 444 486 446 494 C442 498 434 498 428 494" fill="none" stroke="#2a2a2a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M394 476 C398 490 404 500 410 504" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <path d="M474 476 C470 490 466 500 460 504" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

    <!-- beard and moustache -->
    <path d="M384 478 C372 540 362 630 372 720 C382 790 400 850 414 880 C420 900 432 912 446 914 C440 896 446 860 462 820 C478 780 488 750 492 710 C502 630 494 540 484 478 C476 500 462 512 446 508 C436 504 428 504 420 508 C404 512 390 500 384 478 Z" fill="url(#beard)"/>
    <path d="M434 500 C420 494 400 500 390 520 C406 512 420 512 434 516 C448 512 462 512 478 520 C468 500 448 494 434 500 Z" fill="#f8f8f8"/>
    <g fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round">
      <path d="M400 530 C394 600 398 680 414 760"/>
      <path d="M418 528 C414 610 418 700 426 820"/>
      <path d="M436 530 C436 620 436 720 428 860"/>
      <path d="M454 528 C460 610 456 700 444 800"/>
      <path d="M470 532 C478 600 474 670 462 740"/>
      <path d="M388 560 C380 620 382 680 396 740"/>
      <path d="M482 560 C488 620 484 680 474 720"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
      <path d="M410 540 C406 600 410 660 420 720"/><path d="M446 540 C450 610 448 680 438 760"/>
    </g>

    <!-- hat -->
    <path d="M338 400 C352 330 366 262 362 206 C360 166 344 134 296 104 C352 118 396 160 420 222 C444 284 498 346 534 392 Z" fill="url(#hat)"/>
    <path d="M362 206 C360 166 344 134 296 104" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
    <path d="M296 104 C352 118 396 160 420 222 C444 284 498 346 534 392" fill="none" stroke="#b0b0b0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M372 210 C380 250 400 290 420 330" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <path d="M346 372 C390 384 470 384 522 372 L528 384 C470 398 390 398 344 386 Z" fill="#1a1a1a"/>
    <ellipse cx="432" cy="402" rx="206" ry="30" transform="rotate(-3 432 402)" fill="url(#brim)"/>
    <path d="M228 410 C300 434 560 430 636 390" fill="none" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M232 396 C300 378 560 368 634 386" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- classic double ring -->
  <circle cx="500" cy="500" r="472" fill="none" stroke="#bdbdbd" stroke-width="3"/>
  <circle cx="500" cy="500" r="460" fill="none" stroke="#6a6a6a" stroke-width="1.2"/>
</svg>
