<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang'in Adı</title>
<link rel="stylesheet" href="../animation/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #05081c; color: #f5f3ee; font-family: Inter, sans-serif; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { display: block; background: #0a0f2c; }
  body:not(.render) canvas { height: min(84vh, 1920px); width: auto; aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); }
  body.render #stage { padding: 0; }
  body.render #ui { display: none; }
  #ui { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  #ui button { background: #141a3f; color: #f5f3ee; border: 1px solid #2c3570; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #ui input { flex: 1; accent-color: #ff7a3d; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">▶︎ Oynat</button>
    <input id="scrub" type="range" min="0" max="60" step="0.0333" value="0">
    <span id="time">0.00 s</span>
  </div>
</div>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const fams = ['900 40px Montserrat', '800 40px Montserrat', '700 40px Montserrat', '600 40px Montserrat',
    '500 40px Inter', '600 40px Inter', 'italic 500 40px "Cormorant Garamond"', '700 40px "Cormorant Garamond"'];
  await Promise.all(fams.map(f => document.fonts.load(f, 'BİLİM İŞĞÜÇÖ ışğüçö “big bang”')));
  await document.fonts.ready;
  init(canvas);
  window.renderAt = t => { renderFrame(t); return true; };
  window.animReady = true;
  if (params.has('render')) { document.body.classList.add('render'); return; }
  if (params.has('t')) { renderFrame(parseFloat(params.get('t'))); return; }

  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
  scrub.max = TL.duration;
  let playing = false, t0 = 0, start = 0;
  const show = t => { renderFrame(t); scrub.value = t; timeEl.textContent = t.toFixed(2) + ' s'; };
  function loop(now) {
    if (!playing) return;
    let t = t0 + (now - start) / 1000;
    if (t >= TL.duration) { playing = false; btn.textContent = '▶︎ Oynat'; t = TL.duration - 0.001; }
    show(t);
    if (playing) requestAnimationFrame(loop);
  }
  btn.onclick = () => {
    playing = !playing;
    btn.textContent = playing ? '❚❚ Durdur' : '▶︎ Oynat';
    if (playing) {
      t0 = parseFloat(scrub.value); if (t0 >= TL.duration - 0.05) t0 = 0;
      start = performance.now();
      requestAnimationFrame(loop);
    }
  };
  scrub.oninput = () => { playing = false; btn.textContent = '▶︎ Oynat'; show(parseFloat(scrub.value)); };
  show(2.5);
})();
</script>
</body>
</html>
